services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: online_store-app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    env_file:
      - .env

  web:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
